services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.1
    container_name: claude-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: claude-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2y'
      - '--web.enable-admin-api'
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.1
    container_name: claude-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.6.3
    container_name: claude-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: claude-postgres
    environment:
      POSTGRES_DB: agent_manager
      POSTGRES_USER: agent_manager
      POSTGRES_PASSWORD: agent_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  agent-manager-server:
    build:
      context: ./agent-manager/server
      dockerfile: Dockerfile
    container_name: claude-agent-manager-server
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: "postgres://agent_manager:agent_manager@postgres:5432/agent_manager"
      PROMETHEUS_URL: "http://prometheus:9090"
      CLAUDE_PROJECTS_DIR: "/claude-projects"
    volumes:
      - ${HOME}/.claude/projects:/claude-projects:ro
    depends_on:
      - postgres
      - prometheus
    restart: unless-stopped

  agent-manager-ui:
    build:
      context: ./agent-manager/ui
      dockerfile: Dockerfile
    container_name: claude-agent-manager-ui
    ports:
      - "3002:3002"
    depends_on:
      - agent-manager-server
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  postgres_data:
