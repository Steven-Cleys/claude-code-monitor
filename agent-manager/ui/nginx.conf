server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://agent-manager-server:3001;
    }

    location /ws {
        proxy_pass http://agent-manager-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # UI variant prototypes served by the claude-ui-variants container
    # (docker-compose.variants.yml). Resolved per-request via the Docker DNS
    # resolver because that container is optional — a static proxy_pass would
    # keep nginx from starting when it's absent and would cache a stale
    # upstream IP across variant rebuilds.
    location ~ ^/(observatory|reactor|codemap|cyberpunk|lcars|medbay)(/|$) {
        resolver 127.0.0.11 valid=10s;
        set $ui_variants http://ui-variants:3010;
        proxy_pass $ui_variants;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
