server {
    listen 3002;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://agent-manager-server:3001;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://agent-manager-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # nginx closes a proxied connection after 60s without traffic, and a
        # transcript socket can stay quiet much longer than that.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
